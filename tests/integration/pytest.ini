[pytest]
markers =
    slow: opt-in tests bounded by slow platform clocks (Event Grid retry cadence, dead-letter flush, diagnostic-setting latency); deselected by default, include with ./run.sh --include-slow-tests (or run just these with --only-slow-tests)

; Stream progress (settle canaries, wait_for heartbeats) live to the terminal
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(message)s
log_cli_date_format = %H:%M:%S
